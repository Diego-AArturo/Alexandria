name: alexandria_movil
description: "alexanadria app to education."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.1
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.0.0
  flutter_gen: ^5.12.0
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/splash/splash.png
    - assets/icon/icon.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  # Force the same light color in both light/dark modes.
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/splash/splash.png

  android_12:
    # Android 12+ needs its own color to avoid system darkening.
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/splash/splash.png
  
