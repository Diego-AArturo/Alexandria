# Configuración personalizada de PostgreSQL para Alexandria
# Previene cierre de conexiones idle y mejora estabilidad

# Interfaces de red - CRÍTICO: debe escuchar en todas las interfaces
# para aceptar conexiones desde otros contenedores Docker
listen_addresses = '*'          # Escuchar en todas las interfaces de red

# Keepalive TCP para detectar conexiones muertas
tcp_keepalives_idle = 60        # Segundos antes de enviar primer keepalive
tcp_keepalives_interval = 10    # Intervalo entre keepalives
tcp_keepalives_count = 6        # Intentos antes de declarar conexión muerta

# Timeouts de sesiones (0 = sin límite, usamos valores conservadores)
idle_in_transaction_session_timeout = 3600000  # 1 hora en ms
statement_timeout = 300000                      # 5 minutos máximo por statement

# Pool de conexiones
max_connections = 100                           # Suficiente para api + conexiones admin

# Logging para debugging (opcional, comentar en producción)
# log_connections = on
# log_disconnections = on
