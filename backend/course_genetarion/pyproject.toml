[project]
name = "alexandria"
version = "0.1.0"
description = "alexandria using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.4.1"
]

[project.scripts]
alexandria = "alexandria.main:run"
run_crew = "alexandria.main:run"
train = "alexandria.main:train"
replay = "alexandria.main:replay"
test = "alexandria.main:test"
run_with_trigger = "alexandria.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
